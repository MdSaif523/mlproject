<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Predict Student Performance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="page">
    <section class="card">
        <header class="form-header">
            <p class="eyebrow">Student exam performance</p>
            <h1>Predict Mathematics Score</h1>
            <p>Enter the student's details below to predict math score.</p>
        </header>

        <form action="{{ url_for('predict_datapoint') }}" method="post">
            <div class="form-grid">
                <div class="field">
                    <label for="gender">Gender</label>
            <select class="form-control"
                    id="gender"
                    name="gender"
                    required>
                <option value="" selected disabled>Select gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
                </div>

                <div class="field">
                    <label for="ethnicity">Race or ethnicity</label>
            <select class="form-control"
                    id="ethnicity"
                    name="ethnicity"
                    required>
                <option value="" selected disabled>Select group</option>
                <option value="group A">Group A</option>
                <option value="group B">Group B</option>
                <option value="group C">Group C</option>
                <option value="group D">Group D</option>
                <option value="group E">Group E</option>
            </select>
                </div>

                <div class="field field-full">
                    <label for="parental_level_of_education">Parental level of education</label>
            <select class="form-control"
                    id="parental_level_of_education"
                    name="parental_level_of_education"
                    required>
                <option value="" selected disabled>Select education level</option>
                <option value="associate's degree">Associate's degree</option>
                <option value="bachelor's degree">Bachelor's degree</option>
                <option value="master's degree">Master's degree</option>
                <option value="high school">High school</option>
                <option value="some college">Some college</option>
                <option value="some high school">Some high school</option>
            </select>
                </div>

                <div class="field">
                    <label for="lunch">Lunch type</label>
            <select class="form-control"
                    id="lunch"
                    name="lunch"
                    required>
                <option value="" selected disabled>Select lunch type</option>
                <option value="free/reduced">Free/reduced</option>
                <option value="standard">Standard</option>
            </select>
                </div>

                <div class="field">
                    <label for="test_preparation_course">Test preparation course</label>
            <select class="form-control"
                    id="test_preparation_course"
                    name="test_preparation_course"
                    required>
                <option value="" selected disabled>Select course status</option>
                <option value="none">None</option>
                <option value="completed">Completed</option>
            </select>
                </div>

                <div class="field">
                    <label for="reading_score">Reading score (0-100)</label>
            <input class="form-control"
                   id="reading_score"
                   type="number"
                   name="reading_score"
                   placeholder="e.g. 72"
                   min="0"
                   max="100"
                   required>
                </div>

                <div class="field">
                    <label for="writing_score">Writing score (0-100)</label>
            <input class="form-control"
                   id="writing_score"
                   type="number"
                   name="writing_score"
                   placeholder="e.g. 74"
                   min="0"
                   max="100"
                   required>
                </div>

                <div class="field field-full submit-field">
                    <input class="button"
                   type="submit"
                   value="Predict mathematics score">
                </div>
            </div>
        </form>

        {% if results is not none %}
        <p class="result">Predicted mathematics score: <strong>{{ results }}</strong></p>
        {% endif %}
        <a class="back-link" href="{{ url_for('index') }}">Back to home</a>
    </section>
</main>
</body>
</html>
